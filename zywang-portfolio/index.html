  <script>
    // content.js 寫錯時，在畫面上顯示是第幾行
    window.addEventListener('error', function (e) {
      if (!e.filename || e.filename.indexOf('content.js') === -1) return;
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('app').innerHTML =
          '<div class="content-error"><h1>content.js 第 ' + e.lineno + ' 行附近有格式錯誤</h1>' +
          '<p>常見原因：少了逗號 <code>,</code>、少了引號 <code>"</code>，或括號沒有成對。</p>' +
          '<p class="muted">' + String(e.message).replace(/</g, '&lt;') + '</p></div>';
      });
    });
  </script>
</head>
